name: Python Unit Tests
on: [push, pull_request, workflow_dispatch]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip numpy scipy matplotlib
      - run: |
          for f in tests/stage*_test.py; do
            echo "=== Running $f ==="
            python "$f"
          done
